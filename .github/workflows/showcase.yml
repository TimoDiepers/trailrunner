---
name: Showcase

# The five-minute showcase is presented on stage, from a laptop that may have no
# network. This workflow is the standing proof that it can be: it executes the
# notebook the docs page is made of with **no PYST_AUTH_TOKEN in the
# environment**, so every vocabulary lookup has to come from the committed
# examples/pyst_cache.json, exactly as it will on the day.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra viz --extra dynamic
      - run: uv run pytest -q

  showcase:
    # "without a token", not "offline": this job proves the notebook runs with
    # no PYST_AUTH_TOKEN in the environment, which is what makes a network call
    # structurally impossible here (PystTaxonomy is constructed with
    # client=None). It does not sandbox the runner's network, so naming it
    # "offline" would assert more than it tests.
    name: Execute the showcase notebook, without a token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra examples --extra viz --extra dynamic
      - name: Execute the showcase notebook
        # No PYST_AUTH_TOKEN here on purpose: the showcase must run from the
        # committed cache alone, which is exactly what it has to do on stage.
        run: >
          uv run jupyter nbconvert --execute --to notebook --stdout
          examples/showcase.ipynb > /dev/null
      - name: Execute the co-production notebook
        # It is the showcase's other half -- the normative choices the tour
        # points at rather than makes -- and it reads the same committed cache,
        # so it has to keep running from it too.
        run: >
          uv run jupyter nbconvert --execute --to notebook --stdout
          examples/coproduction.ipynb > /dev/null

  docs:
    # The pages under Examples, and the 5-minute tour, are generated from the
    # notebooks by docs/convert_notebooks.py and committed, so GitHub and the
    # docs show the same thing and a docs build needs no notebook toolchain.
    # Committed output goes stale silently, which is what this job is for:
    # regenerate, and fail on a diff.
    name: Docs pages match the notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra docs
      - name: Regenerate the notebook pages
        run: uv run python docs/convert_notebooks.py
      - name: Fail if a page drifted from its notebook
        run: |
          git diff --exit-code -- docs || {
            echo "::error::A docs page differs from its notebook. Run" \
              "'python docs/convert_notebooks.py' and commit the result."
            exit 1
          }
      - name: Build the docs
        run: uv run zensical build
