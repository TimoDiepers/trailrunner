[project]
name = "sentier-trailrunner"
dynamic = ["version"]
description = "Model-based supply chain traversal for life cycle inventories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timo Diepers", email = "timo.diepers@ltt.rwth-aachen.de" }]
maintainers = [{ name = "Timo Diepers", email = "timo.diepers@ltt.rwth-aachen.de" }]
keywords = ["Life Cycle Assessment", "LCA", "inventory", "supply chain", "brightway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = ["pyarrow>=15"]

[project.urls]
source = "https://github.com/TimoDiepers/trailrunner"
homepage = "https://github.com/TimoDiepers/trailrunner"
tracker = "https://github.com/TimoDiepers/trailrunner/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only examples/dac.ipynb needs these. trailpack pulls in pandas and a good
# deal more, and it requires Python 3.12, so it stays out of the runtime
# dependencies: trailrunner reads the parquet files it writes with pyarrow
# alone.
examples = [
  "trailpack; python_version >= '3.12'",
  "pandas>=2",
  "jupyterlab",
]
docs = [
  "zensical",
  "mkdocstrings[python]>=1.0.0",
  "mkdocs-autorefs",
  "pymdown-extensions>=10.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# trailpack 0.2.0 on PyPI is missing its subpackages, so `trailpack.packing`
# cannot be imported from a released wheel. Take it from git until that is
# released. This table is uv-only and is stripped from the built distribution,
# which is what keeps the direct URL out of the published metadata.
[tool.uv.sources]
trailpack = { git = "https://github.com/TimoDiepers/trailpack" }

[tool.hatch.version]
path = "trailrunner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["trailrunner"]

[tool.hatch.build.targets.sdist]
include = ["trailrunner", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
